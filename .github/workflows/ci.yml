name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ReadingTracker.slnx

      - name: Build solution
        run: dotnet build ReadingTracker.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Tests/UnitTests/ReadingTracker.UnitTests.csproj --configuration Release --no-restore --no-build

      - name: Run integration tests
        run: dotnet test Tests/IntegrationTests/ReadingTracker.IntegrationTests.csproj --configuration Release --no-restore --no-build
